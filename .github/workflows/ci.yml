name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Type Check · Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          MONGODB_URI: mongodb://localhost:27017/umojahub-test
          NEXTAUTH_SECRET: test-secret-for-ci-only
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: test
          OPENAI_API_KEY: test
          MPESA_CONSUMER_KEY: test
          MPESA_CONSUMER_SECRET: test
          MPESA_SHORTCODE: '174379'
          MPESA_PASSKEY: test
          MPESA_CALLBACK_URL: http://localhost:3000/api/webhooks/daraja
          AFRICASTALKING_API_KEY: test
          AFRICASTALKING_USERNAME: sandbox
          OPEN_WEATHER_MAP_API_KEY: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test
          CRON_SECRET: test-cron-secret
          WEBHOOK_SECRET: test-webhook-secret

      - name: Check coverage thresholds
        run: npm run test:coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/umojahub-test
          NEXTAUTH_SECRET: test-secret-for-ci-only
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: test
          OPENAI_API_KEY: test
          MPESA_CONSUMER_KEY: test
          MPESA_CONSUMER_SECRET: test
          MPESA_SHORTCODE: '174379'
          MPESA_PASSKEY: test
          MPESA_CALLBACK_URL: http://localhost:3000/api/webhooks/daraja
          AFRICASTALKING_API_KEY: test
          AFRICASTALKING_USERNAME: sandbox
          OPEN_WEATHER_MAP_API_KEY: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test
          CRON_SECRET: test-cron-secret
          WEBHOOK_SECRET: test-webhook-secret

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/umojahub-test
          NEXTAUTH_SECRET: test-secret-for-ci-only
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: test
          OPENAI_API_KEY: test
          MPESA_CONSUMER_KEY: test
          MPESA_CONSUMER_SECRET: test
          MPESA_SHORTCODE: '174379'
          MPESA_PASSKEY: test
          MPESA_CALLBACK_URL: http://localhost:3000/api/webhooks/daraja
          AFRICASTALKING_API_KEY: test
          AFRICASTALKING_USERNAME: sandbox
          OPEN_WEATHER_MAP_API_KEY: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test
          CRON_SECRET: test-cron-secret
          WEBHOOK_SECRET: test-webhook-secret
