<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3ee"/>
      <stop offset="1" stop-color="#dfe8df"/>
    </linearGradient>
  </defs>
  <rect width="680" height="430" rx="18" fill="url(#bg)" stroke="#2f4a2f" stroke-width="2"/>
  <rect x="0" y="0" width="680" height="64" rx="18" fill="#2f4a2f"/>
  <text x="28" y="40" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="1">REPUBLIC OF KENYA</text>
  <text x="28" y="92" fill="#2f4a2f" font-size="15" font-weight="600" letter-spacing="2">NATIONAL IDENTITY CARD</text>

  <!-- photo -->
  <rect x="28" y="112" width="150" height="180" rx="8" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.5"/>
  <circle cx="103" cy="178" r="40" fill="#cdd6cd"/>
  <path d="M53 282 C53 235, 153 235, 153 282 Z" fill="#cdd6cd"/>
  <text x="103" y="312" fill="#7a857a" font-size="11" text-anchor="middle">PHOTO</text>

  <!-- fields -->
  <g fill="#3a3a3a" font-size="13">
    <text x="210" y="130" fill="#6b7280" font-size="11">FULL NAMES</text>
    <text x="210" y="150" font-weight="600" font-size="16" fill="#1f2937">SAMPLE APPLICANT</text>

    <text x="210" y="185" fill="#6b7280" font-size="11">ID NUMBER</text>
    <text x="210" y="205" font-weight="600" font-size="16" fill="#1f2937" font-family="monospace">3• • • • • • •</text>

    <text x="210" y="240" fill="#6b7280" font-size="11">DATE OF BIRTH</text>
    <text x="210" y="259" font-weight="600" font-size="15" fill="#1f2937">01.01.1990</text>

    <text x="420" y="240" fill="#6b7280" font-size="11">DISTRICT OF BIRTH</text>
    <text x="420" y="259" font-weight="600" font-size="15" fill="#1f2937">KENYA</text>

    <text x="210" y="294" fill="#6b7280" font-size="11">SEX</text>
    <text x="210" y="313" font-weight="600" font-size="15" fill="#1f2937">—</text>
  </g>

  <!-- signature strip -->
  <rect x="28" y="332" width="624" height="58" rx="8" fill="#ffffff" stroke="#9aa3ad" stroke-width="1"/>
  <text x="42" y="356" fill="#6b7280" font-size="10">HOLDER'S SIGNATURE</text>
  <path d="M150 378 q20 -18 40 0 t40 0 t40 -6" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>

  <!-- specimen watermark -->
  <text x="340" y="240" fill="#5A2A2A" fill-opacity="0.16" font-size="86" font-weight="800"
        text-anchor="middle" transform="rotate(-18 340 240)" letter-spacing="6">SPECIMEN</text>
  <text x="340" y="414" fill="#6b7280" font-size="11" text-anchor="middle">Sample verification document for demonstration — not a real identity card.</text>
</svg>
